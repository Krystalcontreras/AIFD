<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Patch Sketch V2 - Krystal Contreras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF0F5;
            --card-bg: #FFFFFF;
            --text-main: #D85C8A;
            --text-muted: #8E5B6E;
            --accent-pink: #FFDAE9;
            --accent-dark: #B33965;
            --border-color: #F8C8DC;
            --shadow: 0 10px 30px rgba(216, 92, 138, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2.5rem 1.5rem;
            overflow-x: hidden;
        }

        .background-glow {
            position: fixed;
            top: -20vh;
            left: -20vw;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255, 218, 233, 0.6) 0%, rgba(255, 240, 245, 0) 70%);
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
        }

        .background-glow-2 {
            position: fixed;
            bottom: -20vh;
            right: -20vw;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(216, 92, 138, 0.12) 0%, rgba(255, 240, 245, 0) 70%);
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-out;
        }

        .back-link {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(2.2rem, 4vw, 3.2rem);
            font-weight: 400;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-style: italic;
            color: var(--text-muted);
        }

        main {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 1s ease-out;
            margin-bottom: 2rem;
        }

        .image-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background-color: #FFF5F8;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(216, 92, 138, 0.05);
        }

        .image-container img {
            width: 100%;
            height: auto;
            max-height: 650px;
            object-fit: contain;
            display: block;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .image-container:hover img {
            transform: scale(1.02);
        }

        .details {
            margin-top: 2rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .info-group h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-main);
            margin-bottom: 0.2rem;
        }

        .info-group p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .badge {
            background-color: var(--accent-pink);
            color: var(--accent-dark);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        footer {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 1.5rem 1rem;
            }
            main {
                padding: 1.5rem;
            }
            .details {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>
    <div class="background-glow-2"></div>

    <header>
        <a href="index.html" class="back-link">&larr; Back to Home</a>
        <h1>Mission Patch</h1>
        <div class="subtitle">Concept Sketch Version 2</div>
    </header>

    <main>
        <div class="image-container">
            <img src="missionpatchv2.jpg" alt="Mission Patch Sketch Version 2">
        </div>
        
        <div class="details">
            <div class="info-group">
                <h3>Baruch College SSEP Project</h3>
                <p>Iterative design study focusing on composition, linework, and theme refinement.</p>
            </div>
            <div class="badge">Version 2.0</div>
        </div>
    </main>

    <footer>
        &copy; 2026 Krystal Contreras &bull; Creative Media &amp; Design
    </footer>

</body>
</html>
