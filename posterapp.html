<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looney Tunes Vintage Poster Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bungee&family=Carter+One&family=Caveat:wght@700&family=Changa+One&family=Fredoka+One&family=Montserrat:wght@900&family=Oswald:wght@700&family=Pacifico&family=Permanent+Marker&display=swap" rel="stylesheet">
    <!-- html2canvas library for exporting/downloading poster -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #b7e433; /* Acidic lime green */
            --primary-red: #d9381e;
            --primary-blue: #1c5fd3;
            --primary-yellow: #ffde17;
            --dark-black: #111111;
            --headline-size: 2.8rem;
            --char-size: 160px;
            --headline-font: 'Carter One', cursive;
            --subtitle-font: 'Pacifico', cursive;
            --eyetest-font: 'Changa One', cursive;
            --badge-font: 'Archivo Black', sans-serif;
        }

        body {
            font-family: sans-serif;
            background-color: #222;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* Control Panel */
        .controls {
            background: #333;
            padding: 20px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            max-height: 90vh;
            overflow-y: auto;
        }

        .controls h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--primary-yellow);
        }

        .controls hr {
            border: 0;
            border-top: 1px solid #555;
            margin: 15px 0;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #ccc;
        }

        .control-group input[type="text"], 
        .control-group select,
        .control-group input[type="file"] {
            width: 100%;
            padding: 7px;
            box-sizing: border-box;
            background: #222;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .control-group input[type="file"] {
            padding: 5px;
            cursor: pointer;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .layout-buttons, .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .action-buttons {
            grid-template-columns: 1fr;
        }

        .layout-btn, .toggle-btn, .export-btn, .randomize-btn {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }

        .layout-btn.active {
            background: var(--primary-red);
            border-color: #fff;
            font-weight: bold;
        }

        .toggle-btn {
            background: var(--primary-blue);
            font-weight: bold;
            font-size: 0.85rem;
        }

        .randomize-btn {
            background: #8e44ad;
            color: #fff;
            font-weight: bold;
            font-size: 0.95rem;
            width: 100%;
            padding: 12px;
            border: none;
            margin-bottom: 15px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(142, 68, 173, 0.4);
            transition: background 0.2s;
        }
        .randomize-btn:hover {
            background: #9b59b6;
        }

        .export-btn {
            background: #27ae60;
            font-weight: bold;
            font-size: 0.9rem;
            width: 100%;
            padding: 10px;
            border: none;
            margin-top: 5px;
        }
        .export-btn:hover {
            background: #219653;
        }

        /* Poster Canvas Area */
        .poster-container {
            width: 600px;
            height: 850px;
            background-color: var(--bg-color);
            color: var(--dark-black);
            position: relative;
            overflow: hidden;
            border: 8px solid var(--dark-black);
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            padding: 30px;
            box-sizing: border-box;
            transition: all 0.4s ease;
        }

        .poster-container.style-swiss {
            --bg-color: #b7e433;
            --primary-red: #d9381e;
            --primary-blue: #1c5fd3;
            --primary-yellow: #ffde17;
            --dark-black: #111111;
        }

        .poster-container.style-retro {
            --bg-color: #ff7e33;
            --primary-red: #8b0000;
            --primary-blue: #3b14a7;
            --primary-yellow: #ffe600;
            --dark-black: #2b1d0c;
        }

        .poster-container.style-bauhaus {
            --bg-color: #f4f0ea;
            --primary-red: #e32636;
            --primary-blue: #0f52ba;
            --primary-yellow: #ffcc00;
            --dark-black: #1a1a1a;
        }

        .poster-container.style-noir {
            --bg-color: #121212;
            --primary-red: #ff2a6d;
            --primary-blue: #05d9e8;
            --primary-yellow: #fff01f;
            --dark-black: #ffffff;
        }
        .poster-container.style-noir .main-title {
            text-shadow: 3px 3px 0px #05d9e8;
            color: #ff2a6d;
        }
        .poster-container.style-noir .eye-row, 
        .poster-container.style-noir .top-subtitle {
            color: #ffffff;
            border-color: #ffffff;
        }
        .poster-container.style-noir .bottom-badge {
            background-color: #05d9e8;
            color: #121212;
            border-color: #ffffff;
            box-shadow: 4px 4px 0px #ff2a6d;
        }

        /* Element Base Styles */
        .main-title-area {
            position: absolute;
            transition: all 0.3s ease;
            z-index: 4;
        }

        .main-title {
            font-family: var(--headline-font);
            font-size: var(--headline-size);
            color: var(--primary-red);
            line-height: 0.9;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 3px 3px 0px var(--dark-black);
            white-space: nowrap;
        }

        .top-subtitle {
            font-family: var(--subtitle-font);
            font-size: 1rem;
            color: var(--primary-blue);
            transform: rotate(5deg);
            background: var(--primary-yellow);
            padding: 4px 10px;
            border: 2px solid var(--dark-black);
            border-radius: 4px;
            display: inline-block;
            margin-top: 5px;
        }

        .eye-test-grid {
            position: absolute;
            font-family: var(--eyetest-font);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .eye-row {
            line-height: 1;
            color: var(--dark-black);
        }

        /* Character Box */
        .character-box {
            position: absolute;
            width: var(--char-size);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 3;
        }

        .character-box.hidden {
            display: none;
        }

        .character-box img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: contain;
        }

        .bottom-badge {
            position: absolute;
            width: 90px;
            height: 90px;
            background-color: var(--primary-yellow);
            border: 4px solid var(--dark-black);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: var(--badge-font);
            font-size: 0.6rem;
            color: var(--dark-black);
            transform: rotate(-12deg);
            box-shadow: 4px 4px 0px var(--dark-black);
            transition: all 0.3s ease;
            z-index: 4;
        }

        .poster-container.layout-header .main-title-area { top: 30px; left: 30px; }
        .poster-container.layout-header .eye-test-grid { top: 200px; left: 50%; transform: translateX(-50%); }
        .poster-container.layout-header .bottom-badge { bottom: 30px; left: 30px; }

        .poster-container.layout-center .main-title-area { top: 390px; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .poster-container.layout-center .eye-test-grid { top: 50px; left: 50%; transform: translateX(-50%); opacity: 0.25; }
        .poster-container.layout-center .bottom-badge { bottom: 30px; left: 30px; }

        .poster-container.layout-side .main-title-area { top: 400px; left: 35px; transform: translateY(-50%) rotate(-90deg); transform-origin: left center; }
        .poster-container.layout-side .eye-test-grid { top: 100px; right: 40px; text-align: right; }
        .poster-container.layout-side .bottom-badge { bottom: 30px; left: 160px; }

        .poster-container.layout-corner .main-title-area { top: 40px; right: 40px; text-align: right; }
        .poster-container.layout-corner .eye-test-grid { top: 220px; left: 40px; text-align: left; }
        .poster-container.layout-corner .bottom-badge { bottom: 30px; right: 30px; }

        .poster-container.layout-footer .main-title-area { bottom: 35px; left: 30px; }
        .poster-container.layout-footer .eye-test-grid { top: 80px; left: 50%; transform: translateX(-50%); }
        .poster-container.layout-footer .bottom-badge { top: 30px; left: 30px; }

        .poster-container.char-pos-center .character-box { top: 52%; left: 50%; transform: translate(-50%, -50%); z-index: 1; }
        .poster-container.char-pos-center.layout-center .main-title-area { top: 740px; }
        .poster-container.char-pos-center.layout-header .eye-test-grid { top: 480px; font-size: 0.9rem; }
        .poster-container.char-pos-side .character-box { top: 48%; right: 25px; transform: translateY(-50%); }
        .poster-container.char-pos-bottom .character-box { bottom: 25px; right: 30px; }
    </style>
</head>
<body>

    <div class="controls">
        <h2>Poster Customizer</h2>
        
        <button class="randomize-btn" onclick="generateRandomVariation()">🎲 Auto-Generate Random Variation</button>

        <div class="control-group">
            <label>Poster Aesthetic Style</label>
            <select id="styleSelect">
                <option value="swiss">Swiss Brutalist (Lime)</option>
                <option value="retro">Retro Psychedelic (Orange)</option>
                <option value="bauhaus">Bauhaus Minimalist (Cream)</option>
                <option value="noir">Midnight Noir (Dark Neon)</option>
            </select>
        </div>

        <hr>
        <h3>Typography Controls</h3>

        <div class="control-group">
            <label>Main Headline Font</label>
            <select id="fontHeadline">
                <option value="'Carter One', cursive" selected>Carter One (Cartoon)</option>
                <option value="'Archivo Black', sans-serif">Archivo Black (Heavy Swiss)</option>
                <option value="'Oswald', sans-serif">Oswald (Condensed)</option>
                <option value="'Montserrat', sans-serif">Montserrat (Heavy Modern)</option>
                <option value="'Changa One', cursive">Changa One (Blocky)</option>
                <option value="'Anton', sans-serif">Anton (Impact Bold)</option>
                <option value="'Fredoka One', cursive">Fredoka One (Rounded)</option>
                <option value="'Bungee', cursive">Bungee (Stacked Retro)</option>
                <option value="'Pacifico', cursive">Pacifico (Fluid Script)</option>
                <option value="'Permanent Marker', cursive">Permanent Marker (Grunge)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Top Subtitle Font</label>
            <select id="fontSubtitle">
                <option value="'Pacifico', cursive" selected>Pacifico (Fluid Script)</option>
                <option value="'Carter One', cursive">Carter One (Cartoon)</option>
                <option value="'Archivo Black', sans-serif">Archivo Black (Heavy Swiss)</option>
                <option value="'Oswald', sans-serif">Oswald (Condensed)</option>
                <option value="'Montserrat', sans-serif">Montserrat (Heavy Modern)</option>
                <option value="'Changa One', cursive">Changa One (Blocky)</option>
                <option value="'Anton', sans-serif">Anton (Impact Bold)</option>
                <option value="'Permanent Marker', cursive">Permanent Marker (Grunge)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Eye-Test Grid Font</label>
            <select id="fontEyetest">
                <option value="'Changa One', cursive" selected>Changa One (Blocky)</option>
                <option value="'Carter One', cursive">Carter One (Cartoon)</option>
                <option value="'Archivo Black', sans-serif">Archivo Black (Heavy Swiss)</option>
                <option value="'Oswald', sans-serif">Oswald (Condensed)</option>
                <option value="'Montserrat', sans-serif">Montserrat (Heavy Modern)</option>
                <option value="'Anton', sans-serif">Anton (Impact Bold)</option>
                <option value="'Bungee', cursive">Bungee (Stacked Retro)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Badge Stamp Font</label>
            <select id="fontBadge">
                <option value="'Archivo Black', sans-serif" selected>Archivo Black (Heavy Swiss)</option>
                <option value="'Carter One', cursive">Carter One (Cartoon)</option>
                <option value="'Oswald', sans-serif">Oswald (Condensed)</option>
                <option value="'Montserrat', sans-serif">Montserrat (Heavy Modern)</option>
                <option value="'Anton', sans-serif">Anton (Impact Bold)</option>
                <option value="'Fredoka One', cursive">Fredoka One (Rounded)</option>
            </select>
        </div>

        <hr>
        <h3>Layout & Content</h3>

        <div class="control-group">
            <label>Headline Position Layout</label>
            <div class="layout-buttons">
                <button class="layout-btn active" onclick="setLayout('header')">Header Top</button>
                <button class="layout-btn" onclick="setLayout('center')">Center Stage</button>
                <button class="layout-btn" onclick="setLayout('side')">Side Vertical</button>
                <button class="layout-btn" onclick="setLayout('corner')">Corner Accent</button>
                <button class="layout-btn" onclick="setLayout('footer')">Footer Anchor</button>
            </div>
        </div>

        <div class="control-group">
            <label>Select Character Graphic</label>
            <select id="charSelect">
                <option value="marvin.png">Marvin the Martian</option>
                <option value="BugsBunny.png">Bugs Bunny</option>
                <option value="tweety.png">Tweety Bird</option>
                <option value="lolabunny.png">Lola Bunny</option>
                <option value="Wile.png">Wile E. Coyote</option>
                <option value="Tasmanian.png">Tasmanian Devil</option>
                <option value="loonygroup.png">Looney Tunes Group Photo</option>
                <option value="loonytunes.png">Classic Looney Tunes Logo</option>
            </select>
        </div>

        <div class="control-group">
            <label>Or Upload Custom Image</label>
            <input type="file" id="customImageInput" accept="image/*">
        </div>

        <div class="control-group">
            <label>Character Placement</label>
            <div class="layout-buttons">
                <button class="layout-btn char-pos-btn active" onclick="setCharPosition('bottom')">Bottom Corner</button>
                <button class="layout-btn char-pos-btn" onclick="setCharPosition('side')">Right Side</button>
                <button class="layout-btn char-pos-btn" onclick="setCharPosition('center')">Center Stage</button>
            </div>
        </div>

        <div class="control-group">
            <label>Character Image Size Scaling</label>
            <input type="range" id="charSizeSlider" min="100" max="320" step="5" value="160">
        </div>

        <div class="control-group">
            <label>Main Headline Text</label>
            <input type="text" id="inputTitle" value="TYPOGRAFI">
        </div>

        <div class="control-group">
            <label>Headline Size Scaling</label>
            <input type="range" id="sizeSlider" min="1.5" max="4.5" step="0.1" value="2.8">
        </div>

        <div class="control-group">
            <label>Top Subtitle Text</label>
            <input type="text" id="inputSubtitle" value="Fm Sgm Rsi">
        </div>

        <div class="control-group">
            <label>Badge Stamp Text</label>
            <input type="text" id="inputBadge" value="LOONEY VIBE">
        </div>

        <div class="control-group">
            <label>Character Visibility</label>
            <div class="action-buttons">
                <button class="toggle-btn" onclick="toggleCharacter()">Show / Hide Character</button>
            </div>
        </div>

        <div class="control-group">
            <button class="export-btn" onclick="exportPoster()">Download Poster (PNG)</button>
        </div>
    </div>

    <div class="poster-container layout-header char-pos-bottom style-swiss" id="posterCanvas">
        <div class="main-title-area">
            <h1 class="main-title" id="outputTitle">TYPOGRAFI</h1>
            <div class="top-subtitle" id="outputSubtitle">Fm Sgm Rsi</div>
        </div>

        <!-- Eye-Test Chart -->
        <div class="eye-test-grid" id="outputEyetest">
            <div class="eye-row" style="font-size: 2.4rem;">E F P T</div>
            <div class="eye-row" style="font-size: 1.8rem;">O Z L Y D</div>
            <div class="eye-row" style="font-size: 1.3rem;">P E F C D T</div>
            <div class="eye-row" style="font-size: 0.9rem;">E D F C Z P</div>
        </div>

        <div class="bottom-badge" id="outputBadge">LOONEY<br>VIBE</div>
        
        <!-- Borderless Scalable Character Image Container with Fallback -->
        <div class="character-box" id="characterBox">
            <img src="marvin.png" id="characterImage" alt="Character" onerror="this.src='https://placehold.co/200x200/png?text=Character';">
        </div>
    </div>

    <script>
        const inputTitle = document.getElementById('inputTitle');
        const outputTitle = document.getElementById('outputTitle');
        const sizeSlider = document.getElementById('sizeSlider');
        const charSizeSlider = document.getElementById('charSizeSlider');
        const inputSubtitle = document.getElementById('inputSubtitle');
        const outputSubtitle = document.getElementById('outputSubtitle');
        const inputBadge = document.getElementById('inputBadge');
        const outputBadge = document.getElementById('outputBadge');
        const styleSelect = document.getElementById('styleSelect');
        
        const fontHeadline = document.getElementById('fontHeadline');
        const fontSubtitle = document.getElementById('fontSubtitle');
        const fontEyetest = document.getElementById('fontEyetest');
        const fontBadge = document.getElementById('fontBadge');

        const charSelect = document.getElementById('charSelect');
        const customImageInput = document.getElementById('customImageInput');
        const characterImage = document.getElementById('characterImage');
        const posterCanvas = document.getElementById('posterCanvas');
        const characterBox = document.getElementById('characterBox');
        const outputEyetest = document.getElementById('outputEyetest');

        inputTitle.addEventListener('input', (e) => { outputTitle.textContent = e.target.value; });
        sizeSlider.addEventListener('input', (e) => { 
            document.documentElement.style.setProperty('--headline-size', e.target.value + 'rem'); 
        });
        charSizeSlider.addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--char-size', e.target.value + 'px');
        });
        inputSubtitle.addEventListener('input', (e) => { outputSubtitle.textContent = e.target.value; });
        inputBadge.addEventListener('input', (e) => { outputBadge.innerHTML = e.target.value.replace(' ', '<br>'); });
        
        styleSelect.addEventListener('change', (e) => {
            const currentClasses = Array.from(posterCanvas.classList).filter(c => !c.startsWith('style-'));
            posterCanvas.className = currentClasses.join(' ') + ' style-' + e.target.value;
        });

        // Independent Font Listeners
        fontHeadline.addEventListener('change', (e) => {
            document.documentElement.style.setProperty('--headline-font', e.target.value);
        });
        fontSubtitle.addEventListener('change', (e) => {
            document.documentElement.style.setProperty('--subtitle-font', e.target.value);
        });
        fontEyetest.addEventListener('change', (e) => {
            document.documentElement.style.setProperty('--eyetest-font', e.target.value);
        });
        fontBadge.addEventListener('change', (e) => {
            document.documentElement.style.setProperty('--badge-font', e.target.value);
        });

        charSelect.addEventListener('change', (e) => {
            characterImage.src = e.target.value;
        });

        // Custom Image Upload Listener
        customImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    characterImage.src = uploadEvent.target.result;
                    // Ensure character box is visible when uploading an image
                    if (characterBox.classList.contains('hidden')) {
                        characterBox.classList.remove('hidden');
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        function toggleCharacter() {
            characterBox.classList.toggle('hidden');
        }

        function setLayout(layoutName) {
            const currentClasses = Array.from(posterCanvas.classList);
            const charPosClass = currentClasses.find(c => c.startsWith('char-pos-')) || 'char-pos-bottom';
            const styleClass = currentClasses.find(c => c.startsWith('style-')) || 'style-swiss';
            
            posterCanvas.className = 'poster-container layout-' + layoutName + ' ' + charPosClass + ' ' + styleClass;

            document.querySelectorAll('.layout-btn:not(.char-pos-btn)').forEach(btn => {
                btn.classList.remove('active');
                if(btn.textContent.toLowerCase().includes(layoutName.substring(0,3))) {
                    btn.classList.add('active');
                }
            });
        }

        function setCharPosition(posName) {
            const currentClasses = Array.from(posterCanvas.classList);
            const layoutClass = currentClasses.find(c => c.startsWith('layout-')) || 'layout-header';
            const styleClass = currentClasses.find(c => c.startsWith('style-')) || 'style-swiss';

            posterCanvas.className = 'poster-container ' + layoutClass + ' char-pos-' + posName + ' ' + styleClass;

            document.querySelectorAll('.char-pos-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.textContent.toLowerCase().includes(posName)) {
                    btn.classList.add('active');
                }
            });
        }

        function generateRandomVariation() {
            // Random Style
            const styles = ['swiss', 'retro', 'bauhaus', 'noir'];
            const randomStyle = styles[Math.floor(Math.random() * styles.length)];
            styleSelect.value = randomStyle;
            posterCanvas.className = posterCanvas.className.replace(/style-\w+/, 'style-' + randomStyle);

            // Random Fonts
            const pickRandomOption = (selectEl) => {
                const options = selectEl.options;
                const randomIndex = Math.floor(Math.random() * options.length);
                selectEl.selectedIndex = randomIndex;
                return options[randomIndex].value;
            };

            document.documentElement.style.setProperty('--headline-font', pickRandomOption(fontHeadline));
            document.documentElement.style.setProperty('--subtitle-font', pickRandomOption(fontSubtitle));
            document.documentElement.style.setProperty('--eyetest-font', pickRandomOption(fontEyetest));
            document.documentElement.style.setProperty('--badge-font', pickRandomOption(fontBadge));

            // Random Layouts
            const layouts = ['header', 'center', 'side', 'corner', 'footer'];
            setLayout(layouts[Math.floor(Math.random() * layouts.length)]);

            const charPositions = ['bottom', 'side', 'center'];
            setCharPosition(charPositions[Math.floor(Math.random() * charPositions.length)]);

            // Curated pairs of Character + Matching Title + Subtitle + Badge
            const pairs = [
                { title: "BUGS BUNNY", image: "BugsBunny.png", subtitle: "What's Up Doc?", badge: "WILD TOON" },
                { title: "MARVIN", image: "marvin.png", subtitle: "Earth Shattering", badge: "SPACE MAN" },
                { title: "TWEETY BIRD", image: "tweety.png", subtitle: "I Tawt I Taw", badge: "SWEET BIRD" },
                { title: "LOLA BUNNY", image: "lolabunny.png", subtitle: "Total Legend", badge: "ALL STAR" },
                { title: "WILE E.", image: "Wile.png", subtitle: "Super Genius", badge: "ACME CORP" },
                { title: "TAZMANIA", image: "Tasmanian.png", subtitle: "Spinning Chaos", badge: "DEVIL VIBE" },
                { title: "LOONEY SQUAD", image: "loonygroup.png", subtitle: "Pure Nostalgia", badge: "CLASSIC" },
                { title: "ACME CORP", image: "loonytunes.png", subtitle: "That's All Folks", badge: "EST 1930" }
            ];

            const selectedPair = pairs[Math.floor(Math.random() * pairs.length)];

            // Set Title
            inputTitle.value = selectedPair.title;
            outputTitle.textContent = selectedPair.title;

            // Set Subtitle
            inputSubtitle.value = selectedPair.subtitle;
            outputSubtitle.textContent = selectedPair.subtitle;

            // Set Badge
            inputBadge.value = selectedPair.badge;
            outputBadge.innerHTML = selectedPair.badge.replace(' ', '<br>');

            // Set Character and dropdown
            characterImage.src = selectedPair.image;
            for (let i = 0; i < charSelect.options.length; i++) {
                if (charSelect.options[i].value === selectedPair.image) {
                    charSelect.selectedIndex = i;
                    break;
                }
            }
        }

        function exportPoster() {
            html2canvas(posterCanvas, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'looney-poster.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
